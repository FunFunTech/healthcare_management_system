<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Add Record - Doctor</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-header"><div class="sidebar-logo"><div class="logo-icon">🏥</div><span>Healthcare</span></div></div>
        <ul class="sidebar-nav">
            <li><a th:href="@{/doctor/dashboard}"><span class="nav-icon"></span><span>Dashboard</span></a></li>
            <li><a th:href="@{/doctor/appointments}"><span class="nav-icon"></span><span>Appointments</span></a></li>
            <li><a th:href="@{/doctor/records}" class="active"><span class="nav-icon"></span><span>Records</span></a></li>
            <li><a th:href="@{/doctor/medications}"><span class="nav-icon"></span><span>Medication</span></a></li>
        </ul>
        <div class="sidebar-footer"><form th:action="@{/logout}" method="post" style="margin:0;"><button type="submit" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:0.7rem;padding:0.75rem 1rem;color:#e74c3c;width:100%;font-size:0.9rem;border-radius:8px;transition:background 0.2s;" onmouseover="this.style.background='rgba(231,76,60,0.1)'" onmouseout="this.style.background='none'"><span>Logout</span></button></form></div>
    </aside>
    <div class="main-content">
        <div class="topbar"><span class="topbar-title">Add Medical Record</span></div>
        <div class="page-content">
            <div class="page-header"><h1>Add Medical Record</h1></div>
            <div class="form-card" style="max-width:750px;">
                <form th:action="@{/doctor/records/create}" method="post">
                    <div class="form-grid">
                        <div class="field-group">
                            <label>Patient *</label>
                            <select name="patientId" required>
                                <option value="">-- Select Patient --</option>
                                <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.user.name}"></option>
                            </select>
                        </div>
                        <div class="field-group">
                            <label>Related Appointment</label>
                            <select name="appointmentId">
                                <option value="">-- Optional --</option>
                                <option th:each="a : ${appointments}" th:value="${a.id}"
                                        th:text="${a.patient.user.name} + ' - ' + ${a.appointmentDate}"></option>
                            </select>
                        </div>

                        <div style="grid-column:1/-1;"><h4 style="color:var(--teal);margin-bottom:0.5rem;">Vitals</h4></div>

                        <div class="field-group"><label>Blood Pressure</label><input type="text" name="bloodPressure" placeholder="e.g. 120/80 mmHg"></div>
                        <div class="field-group"><label>Sugar Level</label><input type="text" name="sugarLevel" placeholder="e.g. 90 mg/dL"></div>
                        <div class="field-group"><label>Weight</label><input type="text" name="weight" placeholder="e.g. 70 kg"></div>
                        <div class="field-group"><label>Temperature</label><input type="text" name="temperature" placeholder="e.g. 98.6°F"></div>
                        <div class="field-group"><label>Heart Rate</label><input type="text" name="heartRate" placeholder="e.g. 72 bpm"></div>

                        <div style="grid-column:1/-1;"><h4 style="color:var(--teal);margin-bottom:0.5rem;">Clinical Notes</h4></div>

                        <div class="field-group form-full"><label>Diagnosis</label><textarea name="diagnosis" placeholder="Diagnosis..."></textarea></div>
                        <div class="field-group form-full"><label>Tests Ordered</label><textarea name="tests" placeholder="List tests ordered..."></textarea></div>
                        <div class="field-group form-full"><label>Notes</label><textarea name="notes" placeholder="Additional notes..."></textarea></div>
                    </div>
                    <div class="form-actions">
                        <a th:href="@{/doctor/records}" class="btn btn-outline">Cancel</a>
                        <button type="submit" class="btn btn-teal">Save Record</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
