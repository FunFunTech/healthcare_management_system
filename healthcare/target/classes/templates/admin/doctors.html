<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctors - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo"><div class="logo-icon">🏥</div><span>Healthcare</span></div>
        </div>
        <ul class="sidebar-nav">
            <li><a th:href="@{/admin/dashboard}"><span class="nav-icon"></span><span>Dashboard</span></a></li>
            <li><a th:href="@{/admin/appointments}"><span class="nav-icon"></span><span>Appointments</span></a></li>
            <li><a th:href="@{/admin/doctors}" class="active"><span class="nav-icon"></span><span>Doctors</span></a></li>
            <li><a th:href="@{/admin/patients}"><span class="nav-icon"></span><span>Patients</span></a></li>
        </ul>
        <div class="sidebar-footer"><form th:action="@{/logout}" method="post" style="margin:0;"><button type="submit" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:0.7rem;padding:0.75rem 1rem;color:#e74c3c;width:100%;font-size:0.9rem;border-radius:8px;transition:background 0.2s;" onmouseover="this.style.background='rgba(231,76,60,0.1)'" onmouseout="this.style.background='none'"><span>Logout</span></button></form></div>
    </aside>

    <div class="main-content">
        <div class="topbar"><span class="topbar-title">Doctors</span></div>
        <div class="page-content">
            <div th:if="${success}" class="alert alert-success"><span th:text="${success}"></span></div>
            <div th:if="${error}" class="alert alert-error"><span th:text="${error}"></span></div>

            <div class="page-header">
                <h1>Doctors</h1>
                <p>Manage all doctors in the system</p>
            </div>

            <form th:action="@{/admin/doctors}" method="get">
                <div class="toolbar">
                    <div class="search-box">
                        <span class="search-icon"></span>
                        <input type="text" name="search" placeholder="Search by name or department..."
                               th:value="${search}">
                    </div>
                    <button type="submit" class="btn btn-outline">Search</button>
                    <a th:href="@{/admin/doctors}" class="btn btn-outline">Clear</a>
                    <div class="toolbar-right">
                        <a th:href="@{/admin/doctors/create}" class="btn btn-teal">Add Doctor</a>
                    </div>
                </div>
            </form>

            <div class="card">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Department</th>
                                <th>Specialization</th>
                                <th>Experience</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(doctors)}">
                                <td colspan="8">
                                    <div class="empty-state"><div class="empty-icon">👨‍⚕️</div><p>No doctors found.</p></div>
                                </td>
                            </tr>
                            <tr th:each="doc, stat : ${doctors}">
                                <td th:text="${stat.count}">1</td>
                                <td>
                                    <div style="display:flex;align-items:center;gap:0.6rem;">
                                        <div class="user-avatar" th:text="${doc.user.name.substring(0,1)}">D</div>
                                        <span th:text="'Dr. ' + ${doc.user.name}">Doctor</span>
                                    </div>
                                </td>
                                <td th:text="${doc.user.email}">email</td>
                                <td th:text="${doc.user.phone != null ? doc.user.phone : '-'}">-</td>
                                <td th:text="${doc.department != null ? doc.department : '-'}">-</td>
                                <td th:text="${doc.specialization != null ? doc.specialization : '-'}">-</td>
                                <td th:text="${doc.experience != null ? doc.experience : '-'}">-</td>
                                <td>
                                    <div class="action-btns">
                                        <a th:href="@{/admin/doctors/{id}/edit(id=${doc.id})}" class="btn btn-info btn-sm">Edit</a>
                                        <form th:action="@{/admin/doctors/{id}/delete(id=${doc.id})}" method="post"
                                              onsubmit="return confirm('Delete this doctor?')">
                                            <button type="submit" class="btn btn-danger btn-sm">🗑</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
