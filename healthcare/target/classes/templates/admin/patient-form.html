<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Add Patient</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-header"><div class="sidebar-logo"><div class="logo-icon">🏥</div><span>Healthcare</span></div></div>
        <ul class="sidebar-nav">
            <li><a th:href="@{/admin/dashboard}"><span class="nav-icon"></span><span>Dashboard</span></a></li>
            <li><a th:href="@{/admin/appointments}"><span class="nav-icon"></span><span>Appointments</span></a></li>
            <li><a th:href="@{/admin/doctors}"><span class="nav-icon"></span><span>Doctors</span></a></li>
            <li><a th:href="@{/admin/patients}" class="active"><span class="nav-icon"></span><span>Patients</span></a></li>
        </ul>
        <div class="sidebar-footer"><form th:action="@{/logout}" method="post" style="margin:0;"><button type="submit" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:0.7rem;padding:0.75rem 1rem;color:#e74c3c;width:100%;font-size:0.9rem;border-radius:8px;transition:background 0.2s;" onmouseover="this.style.background='rgba(231,76,60,0.1)'" onmouseout="this.style.background='none'"><span>Logout</span></button></form></div>
    </aside>
    <div class="main-content">
        <div class="topbar"><span class="topbar-title">Add Patient</span></div>
        <div class="page-content">
            <div th:if="${error}" class="alert alert-error">❌ <span th:text="${error}"></span></div>
            <div class="page-header"><h1>Add New Patient</h1></div>
            <div class="form-card" style="max-width:650px;">
                <form th:action="@{/admin/patients/create}" method="post">
                    <div class="form-grid">
                        <div class="field-group"><label>Full Name *</label><input type="text" name="name" required></div>
                        <div class="field-group"><label>Email *</label><input type="email" name="email" required></div>
                        <div class="field-group"><label>Phone</label><input type="text" name="phone"></div>
                        <div class="field-group"><label>Password *</label><input type="password" name="password" required></div>
                        <div class="field-group">
                            <label>Gender</label>
                            <select name="gender">
                                <option value="">-- Select --</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="field-group">
                            <label>Blood Group</label>
                            <select name="bloodGroup">
                                <option value="">-- Select --</option>
                                <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                                <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a th:href="@{/admin/patients}" class="btn btn-outline">Cancel</a>
                        <button type="submit" class="btn btn-teal">Add Patient</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
