<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Medications - Doctor</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-header"><div class="sidebar-logo"><div class="logo-icon">🏥</div><span>Healthcare</span></div></div>
        <ul class="sidebar-nav">
            <li><a th:href="@{/doctor/dashboard}"><span class="nav-icon"></span><span>Dashboard</span></a></li>
            <li><a th:href="@{/doctor/appointments}"><span class="nav-icon"></span><span>Appointments</span></a></li>
            <li><a th:href="@{/doctor/records}"><span class="nav-icon"></span><span>Records</span></a></li>
            <li><a th:href="@{/doctor/medications}" class="active"><span class="nav-icon"></span><span>Medication</span></a></li>
        </ul>
        <div class="sidebar-footer"><form th:action="@{/logout}" method="post" style="margin:0;"><button type="submit" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:0.7rem;padding:0.75rem 1rem;color:#e74c3c;width:100%;font-size:0.9rem;border-radius:8px;transition:background 0.2s;" onmouseover="this.style.background='rgba(231,76,60,0.1)'" onmouseout="this.style.background='none'"><span>Logout</span></button></form></div>
    </aside>

    <div class="main-content">
        <div class="topbar"><span class="topbar-title">Medications</span></div>
        <div class="page-content">
            <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>
            <div class="page-header"><h1>Prescriptions</h1><p>Prescribe medicines to your patients</p></div>

            <div class="grid-2">
                <!-- Prescribe Form -->
                <div class="form-card">
                    <h3 style="margin-bottom:1.25rem;color:var(--teal);">Prescribe Medicine</h3>
                    <form th:action="@{/doctor/medications/prescribe}" method="post">
                        <div class="field-group" style="margin-bottom:0.85rem;">
                            <label>Patient *</label>
                            <select name="patientId" required>
                                <option value="">-- Select Patient --</option>
                                <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.user.name}"></option>
                            </select>
                        </div>
                        <div class="field-group" style="margin-bottom:0.85rem;">
                            <label>Attach to Record</label>
                            <select name="recordId">
                                <option value="">-- Optional --</option>
                                <option th:each="r : ${records}" th:value="${r.id}"
                                        th:text="${r.patient.user.name} + ' - ' + ${r.recordDate}"></option>
                            </select>
                        </div>
                        <div class="field-group" style="margin-bottom:0.85rem;">
                            <label>Medicine Name *</label>
                            <input type="text" name="medicineName" required placeholder="e.g. Paracetamol 500mg">
                        </div>
                        <div class="form-grid">
                            <div class="field-group"><label>Dosage</label><input type="text" name="dosage" placeholder="e.g. 1 tablet"></div>
                            <div class="field-group"><label>Frequency</label><input type="text" name="frequency" placeholder="e.g. Twice daily"></div>
                            <div class="field-group"><label>Duration</label><input type="text" name="duration" placeholder="e.g. 7 days"></div>
                            <div class="field-group"><label>End Date</label><input type="date" name="endDate"></div>
                        </div>
                        <div class="field-group" style="margin-top:0.85rem;">
                            <label>Instructions</label>
                            <textarea name="instructions" placeholder="Special instructions..."></textarea>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-teal">Prescribe</button>
                        </div>
                    </form>
                </div>

                <!-- Prescriptions List -->
                <div class="card">
                    <div class="card-header"><h3>Prescribed Medications</h3></div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr><th>Patient</th><th>Medicine</th><th>Dosage</th><th>Status</th><th>Action</th></tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(medications)}">
                                    <td colspan="5"><div class="empty-state"><div class="empty-icon">💊</div><p>No prescriptions yet.</p></div></td>
                                </tr>
                                <tr th:each="med : ${medications}">
                                    <td th:text="${med.patient.user.name}">Patient</td>
                                    <td>
                                        <div th:text="${med.medicineName}" style="font-weight:600;">Medicine</div>
                                        <div th:text="${med.frequency}" style="font-size:0.78rem;color:var(--text-muted);">Freq</div>
                                    </td>
                                    <td th:text="${med.dosage != null ? med.dosage : '-'}">-</td>
                                    <td>
                                        <span th:class="${med.active} ? 'badge badge-active' : 'badge badge-inactive'"
                                              th:text="${med.active} ? 'Active' : 'Inactive'">Active</span>
                                    </td>
                                    <td>
                                        <form th:if="${med.active}" th:action="@{/doctor/medications/{id}/deactivate(id=${med.id})}" method="post">
                                            <button type="submit" class="btn btn-warning btn-sm">Stop</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
