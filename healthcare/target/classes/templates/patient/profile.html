<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Profile - Patient</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-header"><div class="sidebar-logo"><div class="logo-icon">🏥</div><span>Healthcare</span></div></div>
        <ul class="sidebar-nav">
            <li><a th:href="@{/patient/dashboard}"><span class="nav-icon"></span><span>Dashboard</span></a></li>
            <li><a th:href="@{/patient/appointments}"><span class="nav-icon"></span><span>Appointments</span></a></li>
            <li><a th:href="@{/patient/records}"><span class="nav-icon"></span><span>My Records</span></a></li>
            <li><a th:href="@{/patient/medications}"><span class="nav-icon"></span><span>Medications</span></a></li>
            <li><a th:href="@{/patient/profile}" class="active"><span class="nav-icon"></span><span>Profile</span></a></li>
        </ul>
        <div class="sidebar-footer"><form th:action="@{/logout}" method="post" style="margin:0;"><button type="submit" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:0.7rem;padding:0.75rem 1rem;color:#e74c3c;width:100%;font-size:0.9rem;border-radius:8px;transition:background 0.2s;" onmouseover="this.style.background='rgba(231,76,60,0.1)'" onmouseout="this.style.background='none'"><span>Logout</span></button></form></div>
    </aside>
    <div class="main-content">
        <div class="topbar"><span class="topbar-title">My Profile</span></div>
        <div class="page-content">
            <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>
            <div class="page-header"><h1>My Profile</h1></div>

            <div class="grid-sidebar">
                <!-- Profile Card -->
                <div class="profile-card">
                    <div class="profile-avatar" style="background:#3498db;" th:text="${patient.user.name.substring(0,1)}">P</div>
                    <div class="profile-name" th:text="${patient.user.name}">Patient</div>
                    <div class="profile-dept" th:text="${patient.user.email}">email</div>
                    <div class="profile-info">
                        <div class="profile-info-item">
                            <span class="label">Phone</span>
                            <span class="value" th:text="${patient.user.phone != null ? patient.user.phone : '-'}">-</span>
                        </div>
                        <div class="profile-info-item">
                            <span class="label">Gender</span>
                            <span class="value" th:text="${patient.gender != null ? patient.gender : '-'}">-</span>
                        </div>
                        <div class="profile-info-item">
                            <span class="label">Blood Group</span>
                            <span class="value" th:text="${patient.bloodGroup != null ? patient.bloodGroup : '-'}">-</span>
                        </div>
                        <div class="profile-info-item">
                            <span class="label">Allergies</span>
                            <span class="value" th:text="${patient.allergies != null ? patient.allergies : 'None'}">-</span>
                        </div>
                        <div class="profile-info-item">
                            <span class="label">Emergency</span>
                            <span class="value" th:text="${patient.emergencyContact != null ? patient.emergencyContact : '-'}">-</span>
                        </div>
                    </div>
                </div>

                <!-- Edit Form -->
                <div class="form-card">
                    <h3 style="margin-bottom:1.25rem;color:var(--teal);">Edit Profile</h3>
                    <form th:action="@{/patient/profile/update}" method="post">
                        <div class="form-grid">
                            <div class="field-group"><label>Phone</label><input type="text" name="phone" th:value="${patient.user.phone}"></div>
                            <div class="field-group">
                                <label>Gender</label>
                                <select name="gender">
                                    <option value="">-- Select --</option>
                                    <option value="Male" th:selected="${patient.gender == 'Male'}">Male</option>
                                    <option value="Female" th:selected="${patient.gender == 'Female'}">Female</option>
                                    <option value="Other" th:selected="${patient.gender == 'Other'}">Other</option>
                                </select>
                            </div>
                            <div class="field-group">
                                <label>Blood Group</label>
                                <select name="bloodGroup">
                                    <option value="">-- Select --</option>
                                    <option th:each="bg : ${'A+,A-,B+,B-,O+,O-,AB+,AB-'.split(',')}"
                                            th:value="${bg}" th:text="${bg}"
                                            th:selected="${patient.bloodGroup == bg}">A+</option>
                                </select>
                            </div>
                            <div class="field-group form-full">
                                <label>Address</label>
                                <input type="text" name="address" th:value="${patient.address}">
                            </div>
                            <div class="field-group">
                                <label>Emergency Contact</label>
                                <input type="text" name="emergencyContact" th:value="${patient.emergencyContact}">
                            </div>
                            <div class="field-group">
                                <label>Known Allergies</label>
                                <input type="text" name="allergies" th:value="${patient.allergies}" placeholder="e.g. Penicillin">
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-teal">Save Profile</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
